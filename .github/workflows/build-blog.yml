name: Build Journal

# Regenerates the Journal and commits the result back to main, where
# the existing Pages setup serves it. The rest of the site keeps
# deploying exactly as it did before; this only touches blog output.
#
# The path filters below deliberately exclude generated files. The
# commit this workflow makes therefore cannot match its own trigger,
# and that filter is the guard: the push is made with a deploy key,
# and unlike GITHUB_TOKEN, a deploy key push does start workflows.
#
# Why a deploy key. Main requires the Journal checks to pass before
# anything lands, and this job's commit is generated output with no
# checks of its own. A personal repository cannot let the GitHub
# Actions app past a ruleset, but it can let a deploy key past, so
# this job pushes with one. Without the BUILD_DEPLOY_KEY secret it
# falls back to GITHUB_TOKEN, which works until the ruleset is on.

on:
  push:
    branches: [main]
    paths:
      - 'blog/posts/**'
      - 'tools/**'
      - 'blog.css'
      - 'blog.js'
      - 'blog.tokens.css'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-blog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-journal
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The latest main, not the commit that triggered this run.
          # Two merges seconds apart queue two builds. The second used
          # to check out its own merge commit, which predates the first
          # build's output, so it regenerated every page from a stale
          # base and its rebase conflicted on every generated file. The
          # runs are serialised by the concurrency group, so starting
          # from the tip means each one builds on the one before.
          ref: main
          # A full history keeps the commit this job makes rebaseable
          # if something else landed while it was running.
          fetch-depth: 0
          # The key the ruleset on main lets through. See the top of
          # this file. Empty means the token, as before.
          ssh-key: ${{ secrets.BUILD_DEPLOY_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Nothing reaches the site without passing first. A post that
      # fails a gate leaves the previously published version in place
      # rather than replacing it with something broken.
      - name: Gates
        run: |
          node tools/check-all.mjs --md >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: node tools/build-blog.mjs

      - name: Commit generated output
        run: |
          git config user.name  "krail-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Generated paths only. Sources are never touched here.
          #
          # The root sitemap and robots.txt are on this list because the
          # build writes them too. They were not, and the cost was not a
          # stale sitemap: anything the build touches and this does not
          # stage is left dirty, `git pull --rebase` refuses to run with
          # unstaged changes, and the push never happens. The commit is
          # made, the job fails at exit 128, and the post sits on main
          # with no page ever generated from it.
          git add --all blog/index.html blog/feed.xml blog/sitemap.xml blog/llms.txt \
                        sitemap.xml robots.txt 2>/dev/null || true
          for d in blog/*/; do
            [ "$d" = "blog/posts/" ] && continue
            git add --all "$d" 2>/dev/null || true
          done

          if git diff --staged --quiet; then
            echo "Journal output unchanged. Nothing to commit."
            exit 0
          fi

          # Whatever the build wrote that is still unstaged is either a
          # generated file nobody added to the list above or a stray
          # edit. Either way it must not ride along into the rebase, and
          # discarding it is safe because every source file is already
          # committed by the time this job runs.
          if ! git diff --quiet; then
            echo "Unstaged after staging the generated set:"
            git diff --name-only
            git checkout -- .
          fi

          git commit -m "Journal: rebuild from posts

          Generated by tools/build-blog.mjs. Do not edit these files
          by hand, edit the markdown in blog/posts instead."

          git pull --rebase origin main
          git push origin HEAD:main

      - name: What is live
        run: |
          {
            echo "### Published"
            if [ -f blog/index.html ]; then
              echo ""
              echo "- https://krail.app/blog/"
              for d in blog/*/; do
                [ "$d" = "blog/posts/" ] && continue
                [ -f "$d/index.html" ] && echo "- https://krail.app/${d}"
              done
            else
              echo ""
              echo "No posts are marked ready, so no Journal is published."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
