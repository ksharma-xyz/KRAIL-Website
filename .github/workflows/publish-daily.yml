name: Publish one a day

# Publishes at most one queued post per day, and only one you have
# already looked at.
#
# The queue is open pull requests carrying the `ready-to-publish`
# label. You read the preview, and when you are happy you put the
# label on. The next morning this merges the oldest labelled one and
# stops. Nothing else goes out that day.
#
# Two things follow from that. Nothing reaches krail.app that you have
# not seen, because the label is the only way in. And the Journal
# never publishes two posts on one date, which is what made the last
# batch look like a content dump.
#
# The publish date is read from the commit that lands on main, so the
# dates take care of themselves. Merging on six mornings gives six
# dates. There is no field to set and nothing to keep in sync.

on:
  schedule:
    # Hourly, not daily, because a scheduled run is not a promise.
    # GitHub skips the first window after a schedule is added and drops
    # runs under load, and a once-a-day cron that gets dropped costs a
    # whole day. This one costs an hour.
    #
    # It does not publish more. The guard below stops on the second run
    # of any Sydney day, so the rate is one a day whatever the cron
    # says. Hourly only buys retries.
    #
    # The window below is what keeps those retries in the morning
    # rather than letting a post appear at three in the afternoon
    # because the earlier runs were dropped.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would be published, merge nothing'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: publish-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Is this the right time of day
        id: window
        run: |
          # 6am to noon in Sydney, so seven attempts at the morning
          # rather than one. A run by hand ignores the window, which is
          # how a missed morning gets published later the same day.
          hour=$(TZ=Australia/Sydney date +%-H)
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "open=yes" >> "$GITHUB_OUTPUT"
          elif [ "$hour" -ge 6 ] && [ "$hour" -lt 12 ]; then
            echo "open=yes" >> "$GITHUB_OUTPUT"
          else
            echo "open=no" >> "$GITHUB_OUTPUT"
            echo "It is ${hour}:00 in Sydney, outside the 6am to noon window. Nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Has something already gone out today
        id: today
        if: steps.window.outputs.open == 'yes'
        run: |
          # Sydney, not the runner. This fires at 20:00 UTC, which is
          # already tomorrow here, so a UTC date would let two posts
          # share a day and hold a third back on the day after.
          #
          # A new post file is what counts, not any change under
          # blog/posts. A copy fix to a live post landing on a Thursday
          # morning must not take the slot of the walk scheduled for it.
          today=$(TZ=Australia/Sydney date +%F)
          last=$(TZ=Australia/Sydney git log -1 --diff-filter=A \
                   --date=format-local:%Y-%m-%d --format=%ad \
                   origin/main -- blog/posts || true)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          if [ "$last" = "$today" ]; then
            echo "already=yes" >> "$GITHUB_OUTPUT"
            echo "A post already went out on $today in Sydney. Nothing more today." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "already=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Pick the next queued post that is due
        id: pick
        if: steps.window.outputs.open == 'yes' && steps.today.outputs.already == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Oldest first, so the queue drains in the order you approved
          # it rather than newest wins.
          #
          # Oldest *green* first. The build bot is allowed past the
          # required checks on main so it can push the generated pages,
          # and this job runs as that same bot, so the ruleset alone
          # would not stop it merging a red pull request. This does.
          # Every check on the latest commit has to have finished and
          # passed, and one that is red or still running is skipped
          # rather than holding up the queue behind it.
          candidates=$(gh pr list \
                 --state open \
                 --label ready-to-publish \
                 --json number,createdAt,mergeable \
                 --jq 'sort_by(.createdAt) | map(select(.mergeable != "CONFLICTING")) | .[].number')

          #
          # A post can also carry a date. `publishAt:` in its frontmatter,
          # such as 2026-09-24T09:00+10:00, is the earliest it may go.
          # Before that it waits whatever else happens, a run by hand
          # included. Once due, a dated post goes ahead of undated ones,
          # and on the day a dated post is due, undated ones do not take
          # the slot first at 6am.
          now=$(date +%s)
          today=$(TZ=Australia/Sydney date +%F)
          pr=""; post=""; pick_at=""; hold=""

          for n in $candidates; do
            view=$(gh pr view "$n" --json number,title,headRefOid,statusCheckRollup)
            bad=$(echo "$view" | jq '[.statusCheckRollup[] | (.conclusion // .state // .status) | select(IN("SUCCESS","SKIPPED","NEUTRAL") | not)] | length')
            gates=$(echo "$view" | jq '[.statusCheckRollup[] | select(.name == "Content, accessibility and legal gates" and .conclusion == "SUCCESS")] | length')
            if [ "$bad" != "0" ] || [ "$gates" = "0" ]; then
              echo "- #$n is queued but not green on its latest commit, so it waits." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # The post file tells us the slug, which is the live URL we
            # put in Slack, and the date. Removed files are skipped, so a
            # pull request that replaces a post finds the new one.
            head=$(echo "$view" | jq -r .headRefOid)
            file=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n/files" \
                     --jq '[.[] | select(.status != "removed") | .filename | select(startswith("blog/posts/") and endswith(".md"))] | .[0] // ""')
            src=""
            if [ -n "$file" ]; then
              src=$(gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=$head" --jq .content | base64 -d)
            fi

            # Stamped posts only. A post is written and approved in
            # krail-shorts, and the stamp, approvedHash, is how it says
            # so. A draft without one has not been through that review,
            # so it never goes out, even if the label lands on it by
            # mistake. A pull request with no post file is skipped for
            # the same reason.
            if ! printf '%s\n' "$src" | grep -q '^approvedHash:[[:space:]]*[0-9a-f]'; then
              echo "- #$n is queued but its post carries no approval stamp, so it waits." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            at=$(printf '%s\n' "$src" | sed -n 's/^publishAt:[[:space:]]*//p' | head -1 | tr -d "\r\"'")

            if [ -z "$at" ]; then
              # Undated. Oldest first, and only if nothing is picked yet.
              if [ -z "$pr" ]; then pr="$view"; post="$file"; fi
              continue
            fi

            at_s=$(date -d "$at" +%s 2>/dev/null || true)
            if [ -z "$at_s" ]; then
              echo "- #$n has a publishAt this cannot read, \`$at\`, so it waits." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if [ "$at_s" -gt "$now" ]; then
              echo "- #$n is scheduled for $at, so it waits." >> "$GITHUB_STEP_SUMMARY"
              if [ "$(TZ=Australia/Sydney date -d "$at" +%F)" = "$today" ]; then hold="$n"; fi
              continue
            fi
            # Due. Beats an undated pick, and the earliest date wins.
            if [ -z "$pick_at" ] || [ "$at_s" -lt "$pick_at" ]; then
              pr="$view"; post="$file"; pick_at="$at_s"
            fi
          done

          if [ -n "$pr" ] && [ -z "$pick_at" ] && [ -n "$hold" ]; then
            echo "- Today's slot is kept for #$hold, which is scheduled for later today." >> "$GITHUB_STEP_SUMMARY"
            pr=""
          fi

          if [ -z "$pr" ]; then
            echo "number=" >> "$GITHUB_OUTPUT"
            echo "Nothing labelled ready-to-publish is green and due, so nothing goes out this run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          number=$(echo "$pr" | jq -r .number)
          title=$(echo "$pr"  | jq -r .title)
          # The commit the checks passed on. The merge below refuses if
          # anything was pushed after it.
          echo "head=$(echo "$pr" | jq -r .headRefOid)" >> "$GITHUB_OUTPUT"

          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "title=$title"   >> "$GITHUB_OUTPUT"
          echo "post=$post"     >> "$GITHUB_OUTPUT"
          {
            echo "### Publishing today"
            echo ""
            echo "- #$number $title"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Merge it
        id: merge
        if: steps.pick.outputs.number != '' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Squash, because the post is one change however many times
          # it was revised in review.
          #
          # Not --auto. Auto merge hands off and returns, and this job
          # needs the merge to have actually happened before it can
          # build the page and say so in Slack. The gates already ran
          # on the pull request, and a merge that is not allowed fails
          # here loudly rather than silently queueing.
          gh pr merge "${{ steps.pick.outputs.number }}" --squash --delete-branch \
            --match-head-commit "${{ steps.pick.outputs.head }}"

          for _ in $(seq 1 30); do
            state=$(gh pr view "${{ steps.pick.outputs.number }}" --json state --jq .state)
            [ "$state" = "MERGED" ] && break
            sleep 4
          done
          if [ "$state" != "MERGED" ]; then
            echo "Pull request did not reach MERGED, it is $state." >&2
            exit 1
          fi

      - name: Build the page
        id: build
        if: steps.merge.outcome == 'success' && steps.pick.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A push made with GITHUB_TOKEN does not start another
          # workflow, so merging from here does NOT trigger the Build
          # Journal run that turns the markdown into a page. Without
          # this the post is merged, the site never rebuilds, and the
          # URL we post to Slack is a 404. Dispatching it explicitly
          # is what closes that gap, and needs no personal token.
          gh workflow run build-blog.yml --ref main
          sleep 10

          run_id=$(gh run list --workflow build-blog.yml --branch main \
                     --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run watch "$run_id" --exit-status --interval 10

          git fetch origin main
          git checkout -q origin/main

          slug=$(sed -n 's/^slug: //p' "${{ steps.pick.outputs.post }}" | head -1 | tr -d '\r')
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "url=https://krail.app/blog/$slug/" >> "$GITHUB_OUTPUT"

      - name: Count what is left
        id: queue
        if: always() && steps.pick.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(gh pr list --state open --label ready-to-publish --json number --jq 'length')
          waiting=$(gh pr list --state open --json labels \
                      --jq '[.[] | select([.labels[].name] | index("ready-to-publish") | not)] | length')
          echo "left=$left"       >> "$GITHUB_OUTPUT"
          echo "waiting=$waiting" >> "$GITHUB_OUTPUT"

      - name: Say so in Slack
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/slack-notify
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.SLACK_CHANNEL || 'krail-dev-hq' }}
          title: ${{ steps.pick.outputs.title }}
          url: ${{ steps.build.outputs.url }}
          text: "New on the Journal: ${{ steps.pick.outputs.title }}"
          context: "${{ steps.queue.outputs.left }} queued behind it, ${{ steps.queue.outputs.waiting }} waiting on your review"
          status: ok

      - name: Say so in Slack when it breaks
        if: failure() && steps.pick.outputs.number != ''
        continue-on-error: true
        uses: ./.github/actions/slack-notify
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.SLACK_CHANNEL || 'krail-dev-hq' }}
          title: "Daily publish failed"
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          text: "The daily publish failed on #${{ steps.pick.outputs.number }} ${{ steps.pick.outputs.title }}. Nothing went out."
          status: fail

      - name: Say what is queued behind it
        if: always() && steps.window.outputs.open == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo ""
            echo "### Still queued"
            echo ""
            gh pr list --state open --label ready-to-publish \
              --json number,title --jq '.[] | "- #\(.number) \(.title)"' \
              || echo "Could not read the queue."
            echo ""
            echo "### Waiting on you"
            echo ""
            gh pr list --state open \
              --json number,title,labels \
              --jq '.[] | select([.labels[].name] | index("ready-to-publish") | not) | "- #\(.number) \(.title)"' \
              || echo "Could not read the open pull requests."
          } >> "$GITHUB_STEP_SUMMARY"
